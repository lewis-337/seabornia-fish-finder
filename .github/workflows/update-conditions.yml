name: Hourly regional sea conditions
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: seabornia-pages
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued refresh must start from the latest data committed by the preceding job.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect regional forecasts and cached tide dates
        run: python scripts/update_conditions.py
      - name: Save public conditions only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/conditions.json data/tides.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh regional sea conditions"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Package website
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish HTTPS site
        id: deployment
        uses: actions/deploy-pages@v4
