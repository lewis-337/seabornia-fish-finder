name: Build and update Seabornia fishing PWA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/conditions.json'
      - 'data/tides.json'
      - 'data/area_depths.json'
      - 'data/latest.json'
      - 'data/photo_manifest.json'
      - 'data/fish-name-review.json'
      - 'data/fishing-coverage-v10.json'
      - 'images/fish/**'
      - 'images/maps/**'
      - 'data/marinas.json'
      - 'data/marinas/**'
      - 'data/tide-stations/**'
      - 'data/marina-forecast-grid.json'
      - 'data/marina-map-sources.json'
      - 'data/offline-packs.json'
      - 'README.md'
      - 'PROGRESS.md'
      - 'AGENTS.md'
      - 'QA.md'
      - 'QA-v*.md'
      - 'MARINA-AUDIT.md'
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: seabornia-pages
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued refresh must start from the latest data committed by the preceding job.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: pip install -r requirements.txt
      - name: Check catch parsing
        run: python -m unittest discover -s tests -v
      - name: Check offline cache behavior
        run: node --test tests/*.cjs
      - name: Collect published catch records (best effort)
        if: github.event_name != 'push'
        # If no sources are available, deploy the last known data with an honest stale-data status.
        continue-on-error: true
        run: python scripts/update_catches.py
      - name: Collect public marina-specific catch letters
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python scripts/update_marina_reports.py
          node scripts/refresh_home_evidence.cjs
      - name: Apply reviewed marina profiles and availability
        run: python scripts/apply_marina_enrichment.py
      - name: Collect public weather, marine forecasts and tide predictions
        if: github.event_name != 'push'
        continue-on-error: true
        run: python scripts/update_conditions.py
      - name: Collect Kanto and Okinawa conditions
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python scripts/collect_marina_conditions.py
          python scripts/build_offline_packs.py
      - name: Refresh pinned GEBCO2026 reference cells on manual collection
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python scripts/collect_depths.py
          python scripts/cache_marina_maps.py
      - name: Verify and cache licensed fish photographs
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 8
        run: python scripts/cache_fish_photos.py
      - name: Validate public offline assets
        run: python scripts/build_offline_packs.py
      - name: Save refreshed JSON into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marinas.json data/marinas data/fish-name-review.json data/tide-stations data/marina-forecast-grid.json data/offline-packs.json data/marina-map-sources.json images/maps data/area_depths.json data/conditions.json data/tides.json data/latest.json data/photo_manifest.json images/fish
          if ! git diff --cached --quiet; then
            git commit -m "Refresh catch data"
            git pull --rebase origin main
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package website
        run: python scripts/build_site.py
      - name: Upload browser assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish HTTPS site
        id: deployment
        uses: actions/deploy-pages@v4
